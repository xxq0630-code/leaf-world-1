<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>Leaf World</title>
  <style>
    :root {
      color-scheme: dark;
      --midnight: #07152f;
      --indigo: #10295c;
      --cobalt: #2b5d91;
      --moonlight: #d9ecff;
      --laurel: #789a91;
      --top-band: clamp(64px, 8vh, 86px);
      --bottom-band: clamp(58px, 7vh, 76px);
      --water-height: clamp(132px, 22vh, 230px);
      --moon-size: clamp(270px, 33vw, 510px);
      --moon-sink: clamp(112px, 14vw, 218px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--midnight);
    }

    body {
      min-height: 100svh;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 68%, rgba(43, 93, 145, .28), transparent 30%),
        radial-gradient(circle at 72% 28%, rgba(28, 68, 130, .18), transparent 31%),
        linear-gradient(180deg, #07142e 0%, #0a214d 58%, #123665 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: var(--top-band) 0 var(--bottom-band);
      z-index: -2;
      opacity: .72;
      background-image:
        radial-gradient(circle at 10% 16%, rgba(220, 238, 255, .9) 0 1px, transparent 1.5px),
        radial-gradient(circle at 18% 38%, rgba(127, 176, 231, .65) 0 1px, transparent 1.5px),
        radial-gradient(circle at 31% 12%, rgba(220, 238, 255, .7) 0 1px, transparent 1.4px),
        radial-gradient(circle at 41% 48%, rgba(216, 235, 255, .85) 0 1.4px, transparent 2px),
        radial-gradient(circle at 59% 22%, rgba(134, 183, 236, .6) 0 1px, transparent 1.4px),
        radial-gradient(circle at 69% 44%, rgba(220, 238, 255, .8) 0 1px, transparent 1.6px),
        radial-gradient(circle at 82% 17%, rgba(149, 194, 241, .7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 93% 34%, rgba(220, 238, 255, .75) 0 1px, transparent 1.5px);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: var(--top-band) 0 var(--bottom-band);
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 22% 73%, rgba(91, 145, 199, .18), transparent 26%),
        linear-gradient(90deg, rgba(3, 12, 31, .18), transparent 24%, transparent 76%, rgba(2, 10, 25, .24));
    }

    .band {
      position: absolute;
      inset-inline: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      border-color: rgba(109, 156, 210, .1);
      background: rgba(4, 18, 44, .66);
      backdrop-filter: blur(14px);
    }

    .band--top {
      top: 0;
      height: var(--top-band);
      border-bottom: 1px solid rgba(109, 156, 210, .08);
    }

    .band--bottom {
      bottom: 0;
      height: var(--bottom-band);
      border-top: 1px solid rgba(109, 156, 210, .08);
    }

    .orbit {
      display: flex;
      gap: clamp(28px, 4.4vw, 72px);
      align-items: center;
      justify-content: center;
    }

    .orbit i {
      width: clamp(9px, 1vw, 14px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #355c9a;
      box-shadow: 0 0 18px rgba(91, 139, 210, .16);
    }

    .rule {
      position: absolute;
      left: 50%;
      z-index: 8;
      width: clamp(34px, 3.2vw, 54px);
      height: 3px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: rgba(125, 165, 220, .7);
      box-shadow: 0 0 16px rgba(105, 151, 214, .12);
    }

    .rule--high { top: 18%; }
    .rule--mid { top: 43%; }

    .moon-stage {
      position: absolute;
      left: clamp(26px, 6vw, 112px);
      bottom: calc(var(--bottom-band) + var(--water-height) - var(--moon-sink));
      z-index: 6;
      width: var(--moon-size);
      aspect-ratio: 1;
    }

    .moon {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border-radius: 50%;
      background:
        radial-gradient(circle at 31% 27%, rgba(255,255,255,.76) 0 4%, transparent 5%),
        radial-gradient(circle at 67% 34%, rgba(73, 112, 166, .23) 0 8%, transparent 9%),
        radial-gradient(circle at 40% 65%, rgba(68, 106, 158, .22) 0 12%, transparent 13%),
        radial-gradient(circle at 72% 71%, rgba(255,255,255,.22) 0 7%, transparent 8%),
        radial-gradient(circle at 44% 40%, #f5fbff 0%, #d8eaff 45%, #a9cbef 72%, #7aa5d2 100%);
      box-shadow:
        0 0 22px rgba(218, 237, 255, .88),
        0 0 72px rgba(113, 164, 222, .58),
        0 0 150px rgba(45, 99, 158, .42);
    }

    .moon::before,
    .moon::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(70, 105, 152, .13);
      filter: blur(1px);
    }

    .moon::before {
      width: 28%;
      height: 18%;
      left: 16%;
      top: 44%;
      transform: rotate(18deg);
    }

    .moon::after {
      width: 22%;
      height: 27%;
      right: 15%;
      top: 16%;
      transform: rotate(-24deg);
    }

    .laurel {
      position: absolute;
      z-index: 7;
      bottom: -2%;
      left: -35%;
      width: 58%;
      height: 78%;
      transform: rotate(-19deg);
      transform-origin: 84% 90%;
      filter: drop-shadow(0 0 10px rgba(99, 145, 150, .16));
    }

    .laurel--right {
      left: auto;
      right: -35%;
      transform: scaleX(-1) rotate(-19deg);
      transform-origin: 16% 90%;
    }

    .laurel::before {
      content: "";
      position: absolute;
      left: 48%;
      bottom: 0;
      width: 46%;
      height: 94%;
      border-left: 2px solid rgba(116, 151, 145, .84);
      border-radius: 52% 0 0 46%;
      transform: rotate(21deg);
    }

    .leaf {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: clamp(18px, 2.2vw, 34px);
      height: clamp(34px, 4vw, 60px);
      border: 1px solid rgba(166, 196, 187, .34);
      border-radius: 100% 0 100% 0;
      transform: rotate(var(--r));
      background: linear-gradient(145deg, rgba(130, 164, 154, .9), rgba(50, 89, 91, .78));
      box-shadow: inset 5px 5px 12px rgba(202, 223, 217, .08);
    }

    .panel {
      position: absolute;
      right: clamp(28px, 5vw, 96px);
      bottom: calc(var(--bottom-band) + var(--water-height) + 2vh);
      z-index: 7;
      width: clamp(420px, 45vw, 760px);
      height: clamp(260px, 38vh, 430px);
      clip-path: polygon(4% 0, 100% 0, 100% 92%, 96% 100%, 0 100%, 0 7%);
      border: 1px solid rgba(128, 168, 211, .4);
      background: linear-gradient(145deg, rgba(10, 31, 66, .35), rgba(6, 23, 53, .17));
      box-shadow:
        inset 0 0 0 12px rgba(3, 17, 42, .15),
        0 24px 70px rgba(0, 7, 22, .16);
      backdrop-filter: blur(3px);
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 16px;
      clip-path: inherit;
      border: 1px solid rgba(134, 173, 214, .22);
    }

    .water {
      position: absolute;
      inset-inline: 0;
      bottom: var(--bottom-band);
      z-index: 10;
      height: var(--water-height);
      overflow: hidden;
      background:
        repeating-linear-gradient(0deg, rgba(155, 199, 237, .08) 0 1px, transparent 1px 8px),
        linear-gradient(180deg, rgba(12, 47, 87, .78), rgba(4, 20, 49, .98));
      box-shadow: inset 0 1px rgba(173, 211, 241, .18);
    }

    .reflection {
      position: absolute;
      left: clamp(52px, 7vw, 132px);
      top: -10%;
      width: clamp(230px, 29vw, 450px);
      height: 135%;
      opacity: .78;
      filter: blur(2px);
      transform: perspective(480px) rotateX(54deg);
      transform-origin: center top;
      background:
        repeating-linear-gradient(0deg, transparent 0 10px, rgba(218, 238, 255, .22) 11px 13px, transparent 14px 23px),
        radial-gradient(ellipse at 50% 0%, rgba(234, 246, 255, .88), rgba(103, 162, 215, .38) 34%, transparent 69%);
    }

    .water::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(3, 15, 37, .26), transparent 30%, transparent 70%, rgba(2, 12, 30, .32)),
        repeating-linear-gradient(176deg, transparent 0 14px, rgba(92, 142, 190, .08) 15px 16px, transparent 17px 29px);
    }

    @media (max-width: 820px) {
      :root {
        --water-height: clamp(150px, 24vh, 210px);
        --moon-size: min(78vw, 420px);
        --moon-sink: min(33vw, 172px);
      }

      .rule--high { top: 17%; }
      .rule--mid { top: 36%; }

      .moon-stage {
        left: 50%;
        transform: translateX(-50%);
      }

      .panel {
        left: 7vw;
        right: auto;
        bottom: calc(var(--bottom-band) + var(--water-height) + 2vh);
        width: 86vw;
        height: min(27vh, 260px);
        opacity: .48;
      }

      .reflection {
        left: 18vw;
        width: 64vw;
      }

      .orbit { gap: 8vw; }
      .orbit i { width: 9px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .moon {
        animation: breathe 9s ease-in-out infinite alternate;
      }

      .reflection {
        animation: shimmer 7s ease-in-out infinite alternate;
      }

      @keyframes breathe {
        from { filter: brightness(.96); }
        to { filter: brightness(1.06); }
      }

      @keyframes shimmer {
        from { opacity: .68; transform: perspective(480px) rotateX(54deg) scaleX(.94); }
        to { opacity: .84; transform: perspective(480px) rotateX(54deg) scaleX(1.04); }
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="娌夋蹈寮忔湀澶滄箹闈?>
    <div class="band band--top" aria-hidden="true">
      <div class="orbit"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>

    <i class="rule rule--high" aria-hidden="true"></i>
    <i class="rule rule--mid" aria-hidden="true"></i>

    <div class="moon-stage" aria-hidden="true">
      <div class="moon"></div>
      <div class="laurel laurel--left">
        <i class="leaf" style="--x:47%;--y:68%;--r:47deg"></i>
        <i class="leaf" style="--x:33%;--y:58%;--r:33deg"></i>
        <i class="leaf" style="--x:51%;--y:47%;--r:59deg"></i>
        <i class="leaf" style="--x:39%;--y:36%;--r:40deg"></i>
        <i class="leaf" style="--x:57%;--y:26%;--r:70deg"></i>
        <i class="leaf" style="--x:48%;--y:15%;--r:52deg"></i>
        <i class="leaf" style="--x:67%;--y:9%;--r:78deg"></i>
      </div>
      <div class="laurel laurel--right">
        <i class="leaf" style="--x:47%;--y:68%;--r:47deg"></i>
        <i class="leaf" style="--x:33%;--y:58%;--r:33deg"></i>
        <i class="leaf" style="--x:51%;--y:47%;--r:59deg"></i>
        <i class="leaf" style="--x:39%;--y:36%;--r:40deg"></i>
        <i class="leaf" style="--x:57%;--y:26%;--r:70deg"></i>
        <i class="leaf" style="--x:48%;--y:15%;--r:52deg"></i>
        <i class="leaf" style="--x:67%;--y:9%;--r:78deg"></i>
      </div>
    </div>

    <div class="panel" aria-hidden="true"></div>

    <div class="water" aria-hidden="true">
      <div class="reflection"></div>
    </div>

    <div class="band band--bottom" aria-hidden="true">
      <div class="orbit"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </main>
</body>
</html>
